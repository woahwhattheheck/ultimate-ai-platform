name: ImageMagick current identity repair acceptance

on:
  push:
    branches:
      - zz-relay17/image-current-runtime-20261004
    paths:
      - '.github/workflows/image-current-runtime-relay17.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_BOUNTY_SHA: eacdf3e79ec07d8e3b8e805009f24a1b63fe7b58

jobs:
  maintained-image-tests:
    name: Current Java 21 and native ImageMagick 7
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact original contribution
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.IMAGE_BOUNTY_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IMAGE_BOUNTY_SHA"
          test "$(git rev-parse HEAD^{tree})" = "89164450554ad7dfecabda04bda7be7f07ec3fdb"
          test -z "$(git status --porcelain=v1)"
          mkdir -p "$RUNNER_TEMP/relay17-image-evidence"
          git ls-files -s > "$RUNNER_TEMP/relay17-image-evidence/source-manifest.txt"
          cat /etc/os-release > "$RUNNER_TEMP/relay17-image-evidence/os-release.txt"
          uname -a > "$RUNNER_TEMP/relay17-image-evidence/uname.txt"
      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install existing pinned ImageMagick distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relay17-image-magick" "$RUNNER_TEMP/relay17-image-magick-bin"
          cd "$RUNNER_TEMP/relay17-image-magick"
          curl --fail --location --retry 0 --max-time 120 --output ImageMagick.AppImage https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          printf '%s  %s\n' b22dee096a68e7eb6771a6f98c16490ea78d399ffa27f34ca2ec4f02e707fd9c ImageMagick.AppImage | sha256sum --check -
          chmod +x ImageMagick.AppImage
          ./ImageMagick.AppImage --appimage-extract > /dev/null
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$RUNNER_TEMP/relay17-image-magick/squashfs-root/AppRun" > "$RUNNER_TEMP/relay17-image-magick-bin/magick"
          chmod +x "$RUNNER_TEMP/relay17-image-magick-bin/magick"
          echo "$RUNNER_TEMP/relay17-image-magick-bin" >> "$GITHUB_PATH"
      - name: Run both maintained image classes once
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$RUNNER_TEMP/relay17-image-evidence/java-version.txt"
          magick -version | tee "$RUNNER_TEMP/relay17-image-evidence/imagemagick-version.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/relay17-image-evidence/start.txt"
          ./mvnw -B '-Dtest=ai.ultimate.tools.builtin.ImageProcessingToolTest,ai.ultimate.tools.builtin.ImageProcessingToolSecurityTest' test 2>&1 | tee "$RUNNER_TEMP/relay17-image-evidence/maven.log"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/relay17-image-evidence/finish.txt"
      - name: Record results and require native execution
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "relay17-image-evidence"
          evidence.mkdir(exist_ok=True)
          names = ["ai.ultimate.tools.builtin.ImageProcessingToolTest", "ai.ultimate.tools.builtin.ImageProcessingToolSecurityTest"]
          suites = []
          for name in names:
              path = pathlib.Path("server/target/surefire-reports") / ("TEST-" + name + ".xml")
              if not path.exists():
                  suites.append({"name": name, "missing": True})
                  continue
              root = ET.parse(path).getroot()
              suites.append({"name": name, **{key: int(root.get(key, "0")) for key in ("tests", "failures", "errors", "skipped")}, "seconds": root.get("time"), "cases": [{"name": case.get("name"), "seconds": case.get("time"), "passed": not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))} for case in root.findall("testcase")]})
          changed = subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=no"], text=True).strip()
          receipt = {"source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(), "controller_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "tracked_changes": changed, "command": "./mvnw -B '-Dtest=ai.ultimate.tools.builtin.ImageProcessingToolTest,ai.ultimate.tools.builtin.ImageProcessingToolSecurityTest' test", "suites": suites}
          (evidence / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          assert receipt["source_commit"] == os.environ["IMAGE_BOUNTY_SHA"]
          assert receipt["source_tree"] == "89164450554ad7dfecabda04bda7be7f07ec3fdb"
          assert not changed, changed
          assert all(not suite.get("missing") for suite in suites), suites
          assert [suite["tests"] for suite in suites] == [16, 3], suites
          assert all(suite[key] == 0 for suite in suites for key in ("failures", "errors", "skipped")), suites
          native = [case for case in suites[0]["cases"] if case["name"].startswith("native")]
          assert len(native) == 2 and all(case["passed"] for case in native), native
          PY
      - name: Preserve raw execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-current-runtime-relay17
          path: |
            ${{ runner.temp }}/relay17-image-evidence/
            server/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30
