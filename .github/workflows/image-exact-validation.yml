name: ImageMagick exact-head validation

on:
  push:
    branches:
      - zism8q4/image-exact-validation-49c5d6
    paths:
      - '.github/workflows/image-exact-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/image-exact-validation.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_BOUNTY_SHA: 49c5d6ae35e05e8f13f89d5b1323d12623e40c4d

jobs:
  exact-source-verify:
    name: Exact source clean verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ultimate
          POSTGRES_PASSWORD: ultimate
          POSTGRES_DB: ultimate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact bounty source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.IMAGE_BOUNTY_SHA }}
          fetch-depth: 1

      - name: Prove exact source generation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$IMAGE_BOUNTY_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x server/mvnw

      - name: Build and test exact bounty source
        working-directory: server
        run: ./mvnw clean verify
        env:
          DATABASE_URL: r2dbc:postgresql://localhost:5433/ultimate
          FLYWAY_URL: jdbc:postgresql://localhost:5433/ultimate
          DATABASE_USERNAME: ultimate
          DATABASE_PASSWORD: ultimate
          Ultimate_JWT_SECRET: test-secret-key-minimum-32-chars-long-enough
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload exact-source test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-bounty-exact-49c5d6-test-results
          path: server/target/surefire-reports/
          if-no-files-found: warn

  exact-native-smoke:
    name: Exact source native ImageMagick 7 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact bounty source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.IMAGE_BOUNTY_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source generation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$IMAGE_BOUNTY_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install pinned official ImageMagick 7.1.2-31
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-magick" "$RUNNER_TEMP/image-magick-bin"
          cd "$RUNNER_TEMP/image-magick"
          curl --fail --location --retry 3 --output ImageMagick.AppImage https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          printf '%s  %s\n' b22dee096a68e7eb6771a6f98c16490ea78d399ffa27f34ca2ec4f02e707fd9c ImageMagick.AppImage | sha256sum --check -
          chmod +x ImageMagick.AppImage
          ./ImageMagick.AppImage --appimage-extract > /dev/null
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$RUNNER_TEMP/image-magick/squashfs-root/AppRun" > "$RUNNER_TEMP/image-magick-bin/magick"
          chmod +x "$RUNNER_TEMP/image-magick-bin/magick"
          echo "$RUNNER_TEMP/image-magick-bin" >> "$GITHUB_PATH"

      - name: Record native version
        run: magick -version

      - name: Run existing native smoke on exact bounty source
        working-directory: server
        run: |
          chmod +x mvnw
          ./mvnw '-Dtest=ai.ultimate.tools.builtin.ImageProcessingToolTest#nativeImageMagickSmokeReturnsArtifactAndLeavesNoGeneratedFile' test

      - name: Require one executed test and zero skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "server/target/surefire-reports/TEST-ai.ultimate.tools.builtin.ImageProcessingToolTest.xml"
          suite = ET.parse(path).getroot()
          result = {key: int(suite.get(key, "0")) for key in ("tests", "failures", "errors", "skipped")}
          print(result)
          assert result == {"tests": 1, "failures": 0, "errors": 0, "skipped": 0}, result
          PY

      - name: Upload native smoke result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-bounty-exact-49c5d6-native-smoke
          path: server/target/surefire-reports/
          if-no-files-found: warn
